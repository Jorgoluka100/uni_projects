name: Sync full project notebooks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_full_project_notebooks.py'
      - 'scripts/enrich_project_notebooks.py'
      - 'scripts/validate_notebook_coverage.py'
      - 'scripts/validate_full_portfolio_projects.py'
      - '.github/workflows/full-notebook-sync.yml'
      - 'projects/**/*.py'
      - 'projects/**/*.ipynb'
      - 'projects/**/README.md'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build code-first notebooks
        run: python scripts/build_full_project_notebooks.py

      - name: Preserve originals and add application code
        run: python scripts/enrich_project_notebooks.py

      - name: Validate notebook portfolio
        run: python scripts/validate_notebook_coverage.py

      - name: Validate every project as a complete portfolio piece
        run: python scripts/validate_full_portfolio_projects.py

      - name: Commit generated notebooks
        run: |
          if git diff --quiet -- projects/*/project_notebook.ipynb; then
            echo 'Notebooks already in sync.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/*/project_notebook.ipynb
          git commit -m 'Preserve projects and enrich recruiter notebooks'
          git push

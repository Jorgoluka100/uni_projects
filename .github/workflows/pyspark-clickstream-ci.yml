name: PySpark clickstream project

on:
  pull_request:
    paths:
      - 'projects/pyspark_clickstream_analytics/**'
      - '.github/workflows/pyspark-clickstream-ci.yml'
  push:
    branches: [main]
    paths:
      - 'projects/pyspark_clickstream_analytics/**'
      - '.github/workflows/pyspark-clickstream-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/pyspark_clickstream_analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install PySpark
        run: pip install -r requirements.txt
      - name: Run local Spark self-test
        run: python run.py --self-test
      - name: Validate retained evidence
        run: python run.py --check-evidence
      - name: Compile project
        run: python -m compileall -q run.py src

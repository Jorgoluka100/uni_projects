name: Execute Project 27 Heat Stress Clustering

on:
  workflow_dispatch:
  push:
    paths:
      - 'Heat_Stress_HRV_KMeans_Clustering.ipynb'
      - '.github/workflows/execute_project27.yml'

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib scikit-learn jupyter nbconvert nbclient ipykernel

      - name: Download real Heatstroke Prevention Challenge training data
        run: |
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/spabolu/health_in_climate_ai/main/backend/Train2021.csv" \
            -o heatstroke.csv
          ls -lh heatstroke.csv
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("heatstroke.csv", nrows=5)
          print("Columns:", len(df.columns))
          print(df.columns.tolist())
          PY

      - name: Execute Project 27
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute Heat_Stress_HRV_KMeans_Clustering.ipynb \
            --output Heat_Stress_HRV_KMeans_Clustering.ipynb \
            --ExecutePreprocessor.timeout=2100 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Print key Project 27 results
        run: |
          python - <<'PY'
          import json
          p="Heat_Stress_HRV_KMeans_Clustering.ipynb"
          nb=json.load(open(p, encoding="utf-8"))
          keys=(
            "Shape:", "Feature matrix:", "Model-selection sample:",
            "Best K by silhouette:", "Best K by Davies-Bouldin:",
            "Mean ARI stability:", "Minimum ARI stability:",
            "Selected K:", "Final silhouette", "Final Calinski-Harabasz",
            "Final Davies-Bouldin", "Potential outliers:",
            "Bootstrap runs:", "Bootstrap silhouette mean",
            "All clustering integrity checks passed"
          )
          for cell in nb.get("cells", []):
              for out in cell.get("outputs", []):
                  text=""
                  if out.get("output_type")=="stream":
                      t=out.get("text","")
                      text="".join(t) if isinstance(t,list) else t
                  elif out.get("output_type") in {"execute_result","display_data"}:
                      t=out.get("data",{}).get("text/plain","")
                      text="".join(t) if isinstance(t,list) else t
                  for line in str(text).splitlines():
                      if any(k in line for k in keys):
                          print(line)
          PY

      - name: Commit executed notebook with outputs
        run: |
          rm -f heatstroke.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Heat_Stress_HRV_KMeans_Clustering.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
          else
            git commit -m "Execute Project 27 and save real clustering results"
            git push
          fi

name: Execute Project 30 LongevityAI

on:
  push:
    paths:
      - '30_LongevityAI_Human_Biological_Age_and_Healthspan_Intelligence.ipynb'
      - '.github/workflows/project30-longevityai-run.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert pandas numpy matplotlib scikit-learn

      - name: Execute LongevityAI notebook
        run: |
          jupyter nbconvert             --to notebook             --execute             --inplace             --ExecutePreprocessor.timeout=180             30_LongevityAI_Human_Biological_Age_and_Healthspan_Intelligence.ipynb

      - name: Commit executed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 30_LongevityAI_Human_Biological_Age_and_Healthspan_Intelligence.ipynb
          if git diff --cached --quiet; then
            echo "Notebook outputs already current."
          else
            git commit -m "Execute Project 30 LongevityAI notebook [skip ci]"
            git push
          fi

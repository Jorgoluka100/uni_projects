name: Execute Project 1 PaySim notebook
# rerun: pre-transaction-only model

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project1-paysim-run.yml'

permissions:
  contents: write

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install notebook runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install jupyter nbconvert nbclient ipykernel pandas numpy matplotlib scikit-learn

      - name: Execute notebook with outputs
        run: |
          jupyter nbconvert             --to notebook             --execute 01_AI_Fraud_Transaction_Risk_Intelligence.ipynb             --output 01_AI_Fraud_Transaction_Risk_Intelligence.ipynb             --ExecutePreprocessor.timeout=2400             --ExecutePreprocessor.kernel_name=python3

      - name: Validate executed outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("01_AI_Fraud_Transaction_Risk_Intelligence.ipynb")
          nb = json.loads(p.read_text(encoding="utf-8"))
          code = [c for c in nb["cells"] if c.get("cell_type") == "code"]
          executed = [c for c in code if c.get("execution_count") is not None]
          outputs = [c for c in code if c.get("outputs")]
          print(f"Code cells: {len(code)}")
          print(f"Executed cells: {len(executed)}")
          print(f"Cells with outputs: {len(outputs)}")
          if len(executed) != len(code):
              raise SystemExit("Not every code cell executed.")
          if len(outputs) != len(code):
              raise SystemExit("Not every code cell retained output.")
          PY

      - name: Commit executed notebook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 01_AI_Fraud_Transaction_Risk_Intelligence.ipynb
          if git diff --cached --quiet; then
            echo 'No notebook changes to commit.'
          else
            git commit -m 'Execute interpretable PaySim fraud notebook'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

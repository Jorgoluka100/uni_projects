name: Reliable event pipeline

on:
  push:
    branches: [main]
    paths:
      - 'projects/reliable_event_pipeline/**'
      - '.github/workflows/reliable-event-pipeline-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/reliable_event_pipeline/**'
      - '.github/workflows/reliable-event-pipeline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q projects/reliable_event_pipeline
      - name: Self-test
        working-directory: projects/reliable_event_pipeline
        run: python run.py --self-test
      - name: Unit tests
        working-directory: projects/reliable_event_pipeline
        run: python -m unittest discover -s tests -v

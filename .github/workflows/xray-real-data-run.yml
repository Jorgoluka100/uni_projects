name: Execute real PneumoniaMNIST notebook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xray-real-data-run.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install medmnist scikit-learn pandas matplotlib jupyter nbconvert

      - name: Execute notebook end to end
        env:
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute PyTorch_medical_AI_xray_diagnosis.ipynb \
            --output PyTorch_medical_AI_xray_diagnosis.ipynb \
            --ExecutePreprocessor.timeout=1800 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Mark execution metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('PyTorch_medical_AI_xray_diagnosis.ipynb')
          nb = json.loads(p.read_text())
          nb.setdefault('metadata', {})['execution'] = {
              'primary_dataset': 'PneumoniaMNIST',
              'dataset_type': 'real',
              'verified_at': '2026-10-03',
              'runner': 'GitHub Actions Ubuntu CPU',
              'status': 'passed'
          }
          p.write_text(json.dumps(nb, indent=1))
          print('Notebook execution metadata marked passed.')
          PY

      - name: Verify outputs and integrity marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('PyTorch_medical_AI_xray_diagnosis.ipynb')
          nb = json.loads(p.read_text())
          code = [c for c in nb['cells'] if c['cell_type'] == 'code']
          assert all(c.get('execution_count') is not None for c in code)
          output_count = sum(len(c.get('outputs', [])) for c in code)
          assert output_count >= 15, output_count
          text = json.dumps(nb)
          assert 'All real-data medical-AI integrity checks passed.' in text
          print({'code_cells': len(code), 'outputs': output_count, 'verified': True})
          PY

      - name: Commit executed notebook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PyTorch_medical_AI_xray_diagnosis.ipynb
          if git diff --cached --quiet; then
            echo 'No notebook changes.'
          else
            git commit -m 'Execute real PneumoniaMNIST notebook with retained outputs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

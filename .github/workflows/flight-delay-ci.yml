name: Flight delay project

on:
  push:
    branches: [main]
    paths:
      - 'projects/flight_delay_risk/**'
      - '.github/workflows/flight-delay-ci.yml'
  pull_request:
    paths:
      - 'projects/flight_delay_risk/**'
      - '.github/workflows/flight-delay-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r projects/flight_delay_risk/requirements.txt
      - name: Run offline self-test
        working-directory: projects/flight_delay_risk
        run: python run.py --self-test
      - name: Run unit tests
        working-directory: projects/flight_delay_risk
        run: python -m unittest discover -s tests -v
      - name: Compile project modules
        working-directory: projects/flight_delay_risk
        run: python -m compileall -q run.py src tests

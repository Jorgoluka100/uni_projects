name: Execute real UK house-price notebook

on:
  push:
    branches: [main]
    paths:
      - '01_UK_House_Price_Analysis_and_Prediction.ipynb'
      - '.github/workflows/execute-uk-house-price-real.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb catboost numpy pandas matplotlib scikit-learn jupyter nbconvert ipykernel

      - name: Execute notebook end to end
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute 01_UK_House_Price_Analysis_and_Prediction.ipynb \
            --output 01_UK_House_Price_Analysis_and_Prediction.ipynb \
            --ExecutePreprocessor.timeout=3300 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Verify real-data outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('01_UK_House_Price_Analysis_and_Prediction.ipynb')
          nb = json.loads(path.read_text())

          code = [c for c in nb['cells'] if c['cell_type'] == 'code']
          assert all(c.get('execution_count') is not None for c in code)

          output_count = sum(len(c.get('outputs', [])) for c in code)

          image_count = 0
          for cell in code:
              for output in cell.get('outputs', []):
                  data = output.get('data', {})
                  if 'image/png' in data or 'image/svg+xml' in data:
                      image_count += 1

          text = json.dumps(nb)
          assert 'All UK house-price real-data integrity checks passed.' in text
          assert 'HM Land Registry Price Paid Data' in text
          assert output_count >= 18, output_count
          assert image_count >= 5, image_count

          nb.setdefault('metadata', {})['execution'] = {
              'primary_dataset': 'HM Land Registry Price Paid Data',
              'dataset_type': 'real',
              'evaluation_window': '2026-01-01 to 2026-06-30',
              'runner': 'GitHub Actions Ubuntu CPU',
              'verified_at': '2026-10-03',
              'status': 'passed',
              'embedded_images': image_count,
          }
          path.write_text(json.dumps(nb, indent=1))

          print({
              'code_cells': len(code),
              'outputs': output_count,
              'embedded_images': image_count,
              'verified': True,
          })
          PY

      - name: Commit executed notebook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 01_UK_House_Price_Analysis_and_Prediction.ipynb
          if git diff --cached --quiet; then
            echo 'No notebook changes.'
          else
            git commit -m 'Execute UK house-price notebook with real HMLR data [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Business intelligence showcase

on:
  push:
    branches: [main]
    paths:
      - 'projects/business_intelligence_showcase/**'
      - 'projects/ecommerce_sql_analytics/**'
      - '.github/workflows/business-intelligence-showcase.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify-bi-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analytics runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r projects/ecommerce_sql_analytics/requirements.txt

      - name: Compile-check BI export code
        run: python -m py_compile projects/business_intelligence_showcase/build_exports.py

      - name: Build verified BI extracts
        run: python projects/business_intelligence_showcase/build_exports.py

      - name: Inspect retained BI evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          data = Path('projects/business_intelligence_showcase/data')
          manifest = json.loads((data / 'manifest.json').read_text())
          kpis = pd.read_csv(data / 'kpis.csv').iloc[0]
          assert int(kpis['commercial_orders']) == 98199
          assert int(kpis['unique_customers']) == 94983
          assert abs(float(kpis['merchandise_value_brl']) - 13494400.74) < 0.01
          assert abs(float(kpis['repeat_customer_pct']) - 3.03) < 0.01
          assert manifest['monthly_performance.csv'] == 20
          print(json.dumps(manifest, indent=2))
          print(kpis.to_dict())
          PY

      - name: Commit compact dashboard extracts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/business_intelligence_showcase/data
          if git diff --cached --quiet; then
            echo 'BI extracts are already current.'
          else
            git commit -m 'Refresh verified BI dashboard extracts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

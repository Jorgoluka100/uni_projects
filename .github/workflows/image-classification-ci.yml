name: Image classification project

on:
  push:
    branches: [main]
    paths:
      - 'projects/image_classification_confidence/**'
      - '.github/workflows/image-classification-ci.yml'
  pull_request:
    paths:
      - 'projects/image_classification_confidence/**'
      - '.github/workflows/image-classification-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r projects/image_classification_confidence/requirements.txt
      - name: Run confidence self-test
        working-directory: projects/image_classification_confidence
        run: python run.py --self-test
      - name: Validate retained evidence
        working-directory: projects/image_classification_confidence
        run: python run.py
      - name: Run unit tests
        working-directory: projects/image_classification_confidence
        run: python -m unittest discover -s tests -v
      - name: Compile all project modules
        working-directory: projects/image_classification_confidence
        run: python -m compileall -q run.py src tests

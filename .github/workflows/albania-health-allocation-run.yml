name: Execute Albania healthcare allocation project

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/albania-health-allocation-run.yml'

permissions:
  contents: write

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install jupyter nbconvert nbclient ipykernel pandas numpy matplotlib scipy scikit-learn

      - name: Execute notebook
        run: |
          jupyter nbconvert             --to notebook             --execute 09B_Albania_Healthcare_Resource_Allocation_Optimisation.ipynb             --output 09B_Albania_Healthcare_Resource_Allocation_Optimisation.ipynb             --ExecutePreprocessor.timeout=1800             --ExecutePreprocessor.kernel_name=python3

      - name: Validate execution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("09B_Albania_Healthcare_Resource_Allocation_Optimisation.ipynb")
          nb=json.loads(p.read_text(encoding="utf-8"))
          code=[c for c in nb["cells"] if c.get("cell_type")=="code"]
          executed=[c for c in code if c.get("execution_count") is not None]
          outputs=[c for c in code if c.get("outputs")]
          errors=[o for c in code for o in c.get("outputs",[]) if o.get("output_type")=="error"]
          print("Code cells:",len(code))
          print("Executed:",len(executed))
          print("Output cells:",len(outputs))
          print("Errors:",len(errors))
          if len(code)!=len(executed) or errors:
              raise SystemExit("Notebook validation failed")
          PY

      - name: Commit executed notebook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09B_Albania_Healthcare_Resource_Allocation_Optimisation.ipynb
          if git diff --cached --quiet; then
            echo 'No notebook changes to commit.'
          else
            git commit -m 'Execute Albania healthcare resource allocation project'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Spark KDD classifier evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-kdd-run.yml'
      - 'extensions/spark_kdd_classifiers_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-and-retain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Spark runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyspark pandas numpy scikit-learn

      - name: Execute distributed classifier benchmark
        run: |
          rm -rf spark_kdd_artifacts
          python extensions/spark_kdd_classifiers_v2.py --output-dir spark_kdd_artifacts --sample 150000

      - name: Validate retained Spark evidence
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          root=Path('spark_kdd_artifacts'); p=root/'evaluation.json'; assert p.is_file() and p.stat().st_size>0
          d=json.loads(p.read_text())
          assert 'Historical benchmark only' in d['freshness_warning']
          assert d['deduplicated_rows']>0 and all(int(d['splits'][s])>0 for s in ['train','validation','test'])
          assert d['reload_prediction_match'] is True
          assert d['selected_on_validation_pr_auc'] in {'logistic_regression','naive_bayes'}
          assert set(d['validation'])=={'logistic_regression','naive_bayes'} and set(d['untouched_test'])=={'logistic_regression','naive_bayes'}
          for split in ['validation','untouched_test']:
              for model,metrics in d[split].items():
                  for key in ['pr_auc','roc_auc','precision','recall','specificity']:
                      x=float(metrics[key]); assert math.isfinite(x) and 0<=x<=1, (split,model,key,x)
                  assert sum(int(v) for v in metrics['confusion'].values())>0
          report={'project':'Spark KDD classifiers v2','verification_pass':True,'dataset':d['dataset'],'freshness_warning':d['freshness_warning'],'deduplicated_rows':d['deduplicated_rows'],'splits':d['splits'],'selected_on_validation_pr_auc':d['selected_on_validation_pr_auc'],'validation':d['validation'],'untouched_test':d['untouched_test'],'reload_prediction_match':True,'evidence_policy':'Historical KDD Cup 1999 distributed-ML methodology benchmark; not modern intrusion-detection performance.'}
          (root/'verification.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY

      - name: Retain compact evidence
        run: |
          mkdir -p verified/spark_kdd
          cp spark_kdd_artifacts/evaluation.json spark_kdd_artifacts/verification.json verified/spark_kdd/

      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verified/spark_kdd
          if git diff --cached --quiet; then
            echo 'No generated evidence changed.'
          else
            git commit -m 'Retain verified Spark KDD evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload Spark evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: spark-kdd-evidence
          path: spark_kdd_artifacts/
          retention-days: 30
          if-no-files-found: error

name: Execute Project 5 CLV notebook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project5-clv-run.yml'

permissions:
  contents: write

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install notebook runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install jupyter nbconvert nbclient ipykernel pandas numpy matplotlib scikit-learn openpyxl xgboost shap

      - name: Execute Project 5
        run: |
          jupyter nbconvert             --to notebook             --execute 05_Customer_Lifetime_Value_Next_Best_Action_Engine.ipynb             --output 05_Customer_Lifetime_Value_Next_Best_Action_Engine.ipynb             --ExecutePreprocessor.timeout=3300             --ExecutePreprocessor.kernel_name=python3

      - name: Validate execution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("05_Customer_Lifetime_Value_Next_Best_Action_Engine.ipynb")
          nb = json.loads(p.read_text(encoding="utf-8"))
          code = [c for c in nb["cells"] if c.get("cell_type") == "code"]
          executed = [c for c in code if c.get("execution_count") is not None]
          errors = [
              o for c in code for o in c.get("outputs", [])
              if o.get("output_type") == "error"
          ]
          print(f"Code cells: {len(code)}")
          print(f"Executed cells: {len(executed)}")
          print(f"Errors: {len(errors)}")
          if len(code) != len(executed) or errors:
              raise SystemExit("Notebook execution validation failed.")
          PY

      - name: Commit executed notebook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 05_Customer_Lifetime_Value_Next_Best_Action_Engine.ipynb
          if git diff --cached --quiet; then
            echo 'No notebook changes to commit.'
          else
            git commit -m 'Execute Project 5 CLV notebook with saved outputs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

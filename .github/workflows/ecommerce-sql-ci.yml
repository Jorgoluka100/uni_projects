name: E-commerce SQL project

on:
  push:
    branches: [main]
    paths:
      - 'projects/ecommerce_sql_analytics/**'
      - '.github/workflows/ecommerce-sql-ci.yml'
  pull_request:
    paths:
      - 'projects/ecommerce_sql_analytics/**'
      - '.github/workflows/ecommerce-sql-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r projects/ecommerce_sql_analytics/requirements.txt
      - name: Run synthetic SQL self-test
        working-directory: projects/ecommerce_sql_analytics
        run: python run.py --self-test
      - name: Run SQL logic unit tests
        working-directory: projects/ecommerce_sql_analytics
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        working-directory: projects/ecommerce_sql_analytics
        run: python -m compileall -q run.py src tests

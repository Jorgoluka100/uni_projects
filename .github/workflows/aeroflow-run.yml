name: AeroFlow 2026 verified run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aeroflow-run.yml'
      - 'extensions/aeroflow_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-and-retain:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scikit-learn catboost requests joblib

      - name: Execute official 2026 temporal pipeline
        run: |
          rm -rf aeroflow_artifacts
          python extensions/aeroflow_v2.py

      - name: Validate retained evidence schema
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          import pandas as pd
          root = Path('aeroflow_artifacts')
          required = ['aeroflow_metadata.json','aeroflow_catboost_2026.cbm','aeroflow_carrier_slices.csv']
          for name in required:
              p = root / name
              assert p.is_file() and p.stat().st_size > 0, name
          d = json.loads((root/'aeroflow_metadata.json').read_text())
          assert d['data_year'] == 2026
          assert d['train_months'] == [1,2,3] and d['validation_months'] == [4] and d['test_months'] == [5]
          assert all(int(d['rows'][s]) > 0 for s in ['train','validation','test'])
          assert all(math.isfinite(float(d['catboost_test_metrics'][m])) for m in ['mae','rmse','median_absolute_error','r2'])
          assert 0 <= float(d['conformal']['test_coverage']) <= 1
          assert set(d['baseline_metrics']) == {'global_median','train_only_route_carrier_mean'}
          assert len(d['limitations']) >= 4
          assert not pd.read_csv(root/'aeroflow_carrier_slices.csv').empty
          report = {
              'project':'AeroFlow v2', 'verification_pass':True, 'data_year':d['data_year'],
              'rows':d['rows'], 'baseline_metrics':d['baseline_metrics'],
              'catboost_test_metrics':d['catboost_test_metrics'], 'conformal':d['conformal'],
              'decision_metrics':d['decision_metrics'],
              'evidence_policy':'Official BTS 2026 data; May 2026 untouched temporal test; schedule-time features only.'
          }
          (root/'verification.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY

      - name: Retain compact evidence
        run: |
          mkdir -p verified/aeroflow
          cp aeroflow_artifacts/aeroflow_metadata.json verified/aeroflow/
          cp aeroflow_artifacts/aeroflow_carrier_slices.csv verified/aeroflow/
          cp aeroflow_artifacts/verification.json verified/aeroflow/

      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verified/aeroflow
          if git diff --cached --quiet; then
            echo 'No generated evidence changed.'
          else
            git commit -m 'Retain verified AeroFlow 2026 evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload full model bundle
        uses: actions/upload-artifact@v4
        with:
          name: aeroflow-2026-evidence
          path: aeroflow_artifacts/
          retention-days: 30
          if-no-files-found: error

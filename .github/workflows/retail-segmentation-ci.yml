name: Retail cleaning and segmentation

on:
  pull_request:
    paths:
      - 'projects/retail_customer_segmentation/**'
      - '.github/workflows/retail-segmentation-ci.yml'
  push:
    branches: [main]
    paths:
      - 'projects/retail_customer_segmentation/**'
      - '.github/workflows/retail-segmentation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retail-project:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: projects/retail_customer_segmentation/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r projects/retail_customer_segmentation/requirements.txt

      - name: Run unit tests
        working-directory: projects/retail_customer_segmentation
        run: pytest -q

      - name: Run full UCI pipeline
        working-directory: projects/retail_customer_segmentation
        run: python run.py

      - name: Validate retained verification contract
        working-directory: projects/retail_customer_segmentation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('results/verification.json').read_text())
          assert payload['verification_pass'] is True
          assert payload['customer_feature_rows'] > 1000
          assert 2 <= payload['selected_k'] <= 10
          assert 0.0 < payload['selected_silhouette'] <= 1.0
          assert 0.0 <= payload['cluster_stability']['min'] <= 1.0
          assert payload['cleaning']['final_rows'] > 100000
          print('Retail cleaning and segmentation verification passed.')
          PY

      - name: Upload compact evidence
        uses: actions/upload-artifact@v4
        with:
          name: retail-segmentation-evidence
          path: |
            projects/retail_customer_segmentation/results/verification.json
            projects/retail_customer_segmentation/results/raw_data_audit.json
            projects/retail_customer_segmentation/results/cleaning_report.json
            projects/retail_customer_segmentation/results/cluster_diagnostics.csv
            projects/retail_customer_segmentation/results/cluster_summary.csv
          retention-days: 30
          if-no-files-found: error

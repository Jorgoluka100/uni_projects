name: Execute Project 6 healthcare notebook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project6-healthcare-run.yml'

permissions:
  contents: write

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install jupyter nbconvert nbclient ipykernel pandas numpy matplotlib scikit-learn

      - name: Execute Project 6
        run: |
          jupyter nbconvert             --to notebook             --execute 06_Healthcare_Disease_Progression_Early_Warning.ipynb             --output 06_Healthcare_Disease_Progression_Early_Warning.ipynb             --ExecutePreprocessor.timeout=1200             --ExecutePreprocessor.kernel_name=python3

      - name: Validate execution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("06_Healthcare_Disease_Progression_Early_Warning.ipynb")
          nb = json.loads(p.read_text(encoding="utf-8"))
          code = [c for c in nb["cells"] if c.get("cell_type") == "code"]
          executed = [c for c in code if c.get("execution_count") is not None]
          outputs = [c for c in code if c.get("outputs")]
          print(f"Code cells: {len(code)}")
          print(f"Executed cells: {len(executed)}")
          print(f"Cells with outputs: {len(outputs)}")
          if len(executed) != len(code):
              raise SystemExit("Some code cells did not execute.")
          if len(outputs) != len(code):
              raise SystemExit("Some code cells have no saved outputs.")
          PY

      - name: Commit executed notebook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 06_Healthcare_Disease_Progression_Early_Warning.ipynb
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Execute Project 6 healthcare notebook with outputs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

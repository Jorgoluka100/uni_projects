name: Deep learning marketing training

on:
  push:
    branches: [main]
    paths:
      - 'projects/deep_learning_marketing_response/**'
      - '.github/workflows/deep-learning-marketing-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r projects/deep_learning_marketing_response/requirements.txt
          python -m pip install pytest

      - name: Run neural-network tests
        run: python -m pytest projects/deep_learning_marketing_response/tests -q

      - name: Train PyTorch neural network end to end
        run: |
          cd projects/deep_learning_marketing_response
          rm -rf results artifacts data
          python run.py

      - name: Validate retained training evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('projects/deep_learning_marketing_response')
          metrics = json.loads((root / 'results' / 'metrics.json').read_text())
          history = root / 'results' / 'training_history.csv'
          checkpoint = root / 'artifacts' / 'marketing_mlp.pt'
          preprocessor = root / 'artifacts' / 'preprocessor.joblib'

          assert metrics['epochs_trained'] >= 1
          assert 0.0 <= metrics['neural_network_validation']['roc_auc'] <= 1.0
          assert 0.0 <= metrics['neural_network_test']['roc_auc'] <= 1.0
          assert 0.0 <= metrics['neural_network_test']['pr_auc'] <= 1.0
          assert 0.0 <= metrics['neural_network_test']['threshold'] <= 1.0
          assert history.exists() and history.stat().st_size > 0
          assert checkpoint.exists() and checkpoint.stat().st_size > 0
          assert preprocessor.exists() and preprocessor.stat().st_size > 0
          print(json.dumps({
              'validation_roc_auc': metrics['neural_network_validation']['roc_auc'],
              'test_roc_auc': metrics['neural_network_test']['roc_auc'],
              'test_pr_auc': metrics['neural_network_test']['pr_auc'],
              'epochs_trained': metrics['epochs_trained'],
          }, indent=2))
          PY

      - name: Retain compact evidence
        run: |
          mkdir -p verified/deep_learning_marketing_response
          cp projects/deep_learning_marketing_response/results/metrics.json verified/deep_learning_marketing_response/
          cp projects/deep_learning_marketing_response/results/training_history.csv verified/deep_learning_marketing_response/
          cp projects/deep_learning_marketing_response/results/calibration_bins.csv verified/deep_learning_marketing_response/
          cp projects/deep_learning_marketing_response/results/error_slices.csv verified/deep_learning_marketing_response/

      - name: Commit compact training evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verified/deep_learning_marketing_response
          if git diff --cached --quiet; then
            echo 'Training evidence already matches the retained files.'
          else
            git commit -m 'Retain verified neural-network training evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload model and training bundle
        uses: actions/upload-artifact@v4
        with:
          name: deep-learning-marketing-training
          path: |
            projects/deep_learning_marketing_response/results/
            projects/deep_learning_marketing_response/artifacts/
          retention-days: 30
          if-no-files-found: error

name: Portfolio integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile-check portfolio Python code
        run: python -m py_compile scripts/validate_portfolio.py extensions/aeroflow_v2.py

      - name: Validate portfolio structure and stored notebook evidence
        run: python scripts/validate_portfolio.py

name: Portfolio integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile-check portfolio Python code
        run: python -m compileall -q scripts extensions

      - name: Self-test VisionForge release evidence gate
        run: python extensions/visionforge_release_gate.py --self-test

      - name: Validate portfolio structure and stored notebook evidence
        run: python scripts/validate_portfolio.py

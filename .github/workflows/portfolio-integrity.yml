name: Portfolio integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile-check portfolio Python code
        run: python -m compileall -q scripts extensions projects skills

      - name: Protect original university and course notebooks
        run: python scripts/validate_protected_originals.py

      - name: Validate portfolio manifest and project paths
        run: python scripts/validate_portfolio_manifest.py

      - name: Validate focused skills notebooks
        run: python scripts/validate_skill_notebooks.py

      - name: Validate notebook and Python coverage
        run: python scripts/validate_notebook_coverage.py

      - name: Self-test VisionForge release evidence gate
        run: python extensions/visionforge_release_gate.py --self-test

      - name: Self-test ConsultAI deterministic verifier
        run: python extensions/consultai_verify_v2.py --self-test

      - name: Self-test pathfinding benchmark
        run: python extensions/pathfinding_benchmark_v2.py --self-test

      - name: Self-test healthcare evidence gate
        run: python extensions/healthcare_evidence_gate.py --self-test

      - name: Validate new production project evidence
        run: python scripts/validate_new_projects.py

      - name: Validate portfolio structure and stored notebook evidence
        run: python scripts/validate_portfolio.py

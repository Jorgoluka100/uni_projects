name: Customer churn project

on:
  pull_request:
    paths:
      - 'projects/customer_churn_prediction/**'
      - '.github/workflows/customer-churn-ci.yml'
  push:
    branches: [main]
    paths:
      - 'projects/customer_churn_prediction/**'
      - '.github/workflows/customer-churn-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/customer_churn_prediction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run self-test
        run: python run.py --self-test
      - name: Validate retained evidence
        run: python run.py --check-evidence
      - name: Run unit tests
        run: pytest -q
      - name: Compile project
        run: python -m compileall -q run.py src tests

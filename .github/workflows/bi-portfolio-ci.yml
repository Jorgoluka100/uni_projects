name: BI portfolio project

on:
  push:
    branches: [main]
    paths:
      - 'projects/executive_commerce_bi/**'
      - 'projects/ecommerce_sql_analytics/**'
      - '.github/workflows/bi-portfolio-ci.yml'
  workflow_dispatch:

concurrency:
  group: bi-portfolio-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-bi-project:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install BI and warehouse runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r projects/ecommerce_sql_analytics/requirements.txt
          python -m pip install pyarrow

      - name: Self-test governed BI exports
        run: python projects/executive_commerce_bi/prepare_bi_data.py --self-test

      - name: Rebuild pinned warehouse, analysis and dashboard extracts
        run: python projects/executive_commerce_bi/refresh_verified_data.py

      - name: Build right-censored cohort retention analysis
        run: python projects/executive_commerce_bi/cohort_analysis.py

      - name: Feed deep analysis into Tableau extract
        run: python projects/executive_commerce_bi/enrich_tableau_analysis.py

      - name: Render dashboard preview from verified analysis
        run: python projects/executive_commerce_bi/render_dashboard_preview.py

      - name: Validate retained dashboard and analysis evidence
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          project = Path('projects/executive_commerce_bi')
          data = project / 'data'
          manifest = json.loads((data / 'manifest.json').read_text())
          assert manifest['verification']['verification_pass'] is True
          assert manifest['verification']['headline']['commercial_orders'] == 98199
          assert manifest['verification']['headline']['unique_customers'] == 94983
          assert abs(manifest['verification']['headline']['merchandise_value_brl'] - 13494400.74) < 0.01
          assert abs(manifest['verification']['headline']['repeat_customer_pct'] - 3.03) < 0.01

          executive = pd.read_csv(data / 'executive_kpis.csv').iloc[0]
          assert int(executive['commercial_orders']) == 98199
          assert len(pd.read_csv(data / 'monthly_performance.csv')) == 20
          assert len(pd.read_csv(data / 'state_performance.csv')) >= 20
          assert len(pd.read_csv(data / 'seller_operational_review.csv')) > 0

          analysis = json.loads((data / 'analysis_summary.json').read_text())
          assert analysis['scope']['commercial_orders'] == 98199
          assert analysis['delivery']['review_score_gap'] > 0
          assert analysis['customers']['repeat_customer_pct'] == 3.03
          assert analysis['cohort_retention']['month_1_weighted_retention_pct'] >= 0
          assert analysis['cohort_retention']['month_3_weighted_retention_pct'] >= 0
          assert len(pd.read_csv(data / 'analysis_delivery_impact.csv')) >= 4
          assert len(pd.read_csv(data / 'analysis_state_performance.csv')) >= 20
          assert len(pd.read_csv(data / 'analysis_category_performance.csv')) >= 20
          cohort = pd.read_csv(data / 'analysis_retention_curve.csv')
          assert float(cohort.loc[cohort['month_number'] == 0, 'weighted_retention_pct'].iloc[0]) == 100.0
          assert cohort['observable_cohorts'].is_monotonic_decreasing
          priority = pd.read_csv(data / 'analysis_operational_priority.csv')
          assert len(priority) > 0
          assert priority['late_order_merchandise_value_brl'].is_monotonic_decreasing
          tableau = pd.read_csv(data / 'tableau_dashboard_long.csv')
          assert {'Customer Segment', 'Cohort Retention', 'Delay Impact', 'Operational Priority'}.issubset(set(tableau['section']))
          assert (project / 'VERIFIED_ANALYSIS.md').exists()
          preview = project / 'dashboard_preview.svg'
          assert preview.exists() and preview.stat().st_size > 3000
          print(json.dumps(analysis, indent=2))
          PY

      - name: Validate Power BI and Tableau source contracts
        run: python -m unittest discover -s projects/executive_commerce_bi/tests -p 'test_*.py'

      - name: Retain compact dashboard data and analysis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Preserve the already-validated generated outputs outside the worktree.
          tar -czf /tmp/verified-bi-output.tgz \
            projects/executive_commerce_bi/data \
            projects/executive_commerce_bi/VERIFIED_ANALYSIS.md \
            projects/executive_commerce_bi/dashboard_preview.svg

          # Other portfolio workflows may write evidence to main at the same time.
          # Rebase generated files onto the newest remote tree and retry a racing push
          # rather than failing a fully validated analysis because of a bot-bot conflict.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            tar -xzf /tmp/verified-bi-output.tgz
            git add \
              projects/executive_commerce_bi/data \
              projects/executive_commerce_bi/VERIFIED_ANALYSIS.md \
              projects/executive_commerce_bi/dashboard_preview.svg

            if git diff --cached --quiet; then
              echo 'Dashboard and analysis extracts are already current.'
              exit 0
            fi

            git commit -m 'Refresh verified BI dashboard analysis'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another workflow; retrying (${attempt}/3)."
          done

          echo 'Unable to retain verified BI outputs after three synchronized attempts.' >&2
          exit 1

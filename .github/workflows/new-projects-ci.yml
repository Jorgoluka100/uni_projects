name: New production projects

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - '.github/workflows/new-projects-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-new-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn joblib
      - name: Run self-tests
        run: |
          python projects/careerlens_ai/run.py --self-test
          python projects/experiment_lab/run.py --self-test
          python projects/model_watch/run.py --self-test
      - name: Execute clean evidence runs
        run: |
          rm -rf careerlens_artifacts experimentlab_artifacts modelwatch_artifacts
          python projects/careerlens_ai/run.py --output-dir careerlens_artifacts
          python projects/experiment_lab/run.py --output-dir experimentlab_artifacts
          python projects/model_watch/run.py --output-dir modelwatch_artifacts
      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('careerlens_artifacts/verification.json'), Path('experimentlab_artifacts/verification.json'), Path('modelwatch_artifacts/verification.json')]:
              payload=json.loads(path.read_text())
              assert payload.get('verification_pass') is True, path
          print('All new project verification records passed.')
          PY
      - name: Retain compact evidence
        run: |
          mkdir -p verified/careerlens_ai verified/experiment_lab verified/model_watch
          cp careerlens_artifacts/verification.json verified/careerlens_ai/
          cp careerlens_artifacts/ranking.csv verified/careerlens_ai/
          cp experimentlab_artifacts/verification.json verified/experiment_lab/
          cp modelwatch_artifacts/verification.json verified/model_watch/
          cp modelwatch_artifacts/batch_summary.csv verified/model_watch/
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verified/careerlens_ai verified/experiment_lab verified/model_watch
          if git diff --cached --quiet; then
            echo 'No generated evidence changed.'
          else
            git commit -m 'Retain verified new project evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload full evidence bundles
        uses: actions/upload-artifact@v4
        with:
          name: new-production-project-evidence
          path: |
            careerlens_artifacts/
            experimentlab_artifacts/
            modelwatch_artifacts/
          retention-days: 30
          if-no-files-found: error

name: New production projects

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'verified/**'
      - 'scripts/validate_new_projects.py'
      - '.github/workflows/new-projects-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-new-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn joblib fastapi uvicorn
      - name: Run self-tests
        run: |
          python projects/experiment_lab/run.py --self-test
          python projects/model_watch/run.py --self-test
          python projects/grounded_rag/run.py --self-test
      - name: Smoke-test GroundedRAG API
        run: |
          cd projects/grounded_rag
          python - <<'PY'
          import api
          health = api.health()
          assert api.app.title == 'GroundedRAG'
          assert api.app.version == '2.0.0'
          assert health['status'] == 'ok'
          assert health['dense_embedding_dimensions'] >= 2
          assert 'ticket_analytics' in health['tools']
          print('GroundedRAG v2 API import/health smoke test passed.')
          PY
      - name: Execute clean evidence runs
        run: |
          rm -rf experimentlab_artifacts modelwatch_artifacts groundedrag_artifacts
          python projects/experiment_lab/run.py --output-dir experimentlab_artifacts
          python projects/model_watch/run.py --output-dir modelwatch_artifacts
          python projects/grounded_rag/run.py --output-dir groundedrag_artifacts
      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('experimentlab_artifacts/verification.json'),
              Path('modelwatch_artifacts/verification.json'),
              Path('groundedrag_artifacts/verification.json'),
          ]
          for path in paths:
              payload = json.loads(path.read_text())
              assert payload.get('verification_pass') is True, path
          grounded = json.loads(Path('groundedrag_artifacts/verification.json').read_text())
          assert grounded['tool_route_accuracy'] == 1.0
          assert grounded['tool_result_accuracy'] == 1.0
          assert grounded['tool_execution_on_attack_rate'] == 0.0
          print('All production-project verification records passed.')
          PY
      - name: Validate retained evidence
        run: python scripts/validate_new_projects.py
      - name: Retain compact evidence
        run: |
          mkdir -p verified/experiment_lab verified/model_watch verified/grounded_rag
          cp experimentlab_artifacts/verification.json verified/experiment_lab/
          cp modelwatch_artifacts/verification.json verified/model_watch/
          cp modelwatch_artifacts/batch_summary.csv verified/model_watch/
          cp groundedrag_artifacts/verification.json verified/grounded_rag/
          cp groundedrag_artifacts/retrieval_eval.csv verified/grounded_rag/
          cp groundedrag_artifacts/tool_eval.csv verified/grounded_rag/
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verified/experiment_lab verified/model_watch verified/grounded_rag
          if git diff --cached --quiet; then
            echo 'No generated evidence changed.'
          else
            git commit -m 'Retain verified production project evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload full evidence bundles
        uses: actions/upload-artifact@v4
        with:
          name: production-project-evidence
          path: |
            experimentlab_artifacts/
            modelwatch_artifacts/
            groundedrag_artifacts/
          retention-days: 30
          if-no-files-found: error

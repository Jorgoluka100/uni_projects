name: Albania all-age allocation tests

on:
  push:
    branches: [main, portfolio-next-level]
    paths:
      - "extensions/albania_all_age_allocation.py"
      - "tests/test_albania_all_age_allocation.py"
      - ".github/workflows/albania-all-age-tests.yml"
  pull_request:
    paths:
      - "extensions/albania_all_age_allocation.py"
      - "tests/test_albania_all_age_allocation.py"
      - ".github/workflows/albania-all-age-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Run all-age allocation tests
        run: python -m unittest discover -s tests -p "test_albania_all_age_allocation.py" -v

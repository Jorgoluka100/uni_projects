name: Execute Project 30 LongevityAI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '30_LongevityAI_Biological_Age_and_Healthy_Aging_Intelligence.ipynb'
      - '.github/workflows/execute_project30_longevity.yml'

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib scikit-learn jupyter nbconvert nbclient ipykernel

      - name: Verify NHANES source is reachable
        run: |
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/epenning/aging-biomarkers/main/nhanes_data.csv" \
            -o /tmp/nhanes_longevity.csv
          python - <<'PY'
          import pandas as pd
          p="/tmp/nhanes_longevity.csv"
          df=pd.read_csv(p)
          print("NHANES source rows:", len(df))
          print("NHANES source columns:", len(df.columns))
          print("Age range:", df["Age"].min(), df["Age"].max())
          PY

      - name: Execute Project 30
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute 30_LongevityAI_Biological_Age_and_Healthy_Aging_Intelligence.ipynb \
            --output 30_LongevityAI_Biological_Age_and_Healthy_Aging_Intelligence.ipynb \
            --ExecutePreprocessor.timeout=2100 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Print Project 30 results
        run: |
          python - <<'PY'
          import json
          p="30_LongevityAI_Biological_Age_and_Healthy_Aging_Intelligence.ipynb"
          nb=json.load(open(p, encoding="utf-8"))
          keys=(
              "Raw shape:", "Adult cohort:", "Predictor count:",
              "Mean-age baseline", "Selected by CV MAE:", "Best model:",
              "Test MAE:", "Test RMSE:", "Test R²:",
              "Training residual-age bias slope:",
              "Corrected age-acceleration mean:",
              "Correlation(corrected gap",
              "PROJECT 30 — LONGEVITYAI FINAL EXECUTIVE SUMMARY",
              "Real adult NHANES participants analysed:",
              "Top predictive age signals:",
              "PROJECT 30 COMPLETE",
              "All Project 30 integrity checks passed"
          )
          for cell in nb.get("cells", []):
              for out in cell.get("outputs", []):
                  text=""
                  if out.get("output_type")=="stream":
                      t=out.get("text","")
                      text="".join(t) if isinstance(t,list) else t
                  elif out.get("output_type") in {"execute_result","display_data"}:
                      t=out.get("data",{}).get("text/plain","")
                      text="".join(t) if isinstance(t,list) else t
                  for line in str(text).splitlines():
                      if any(k in line for k in keys):
                          print(line)
          PY

      - name: Commit executed notebook with outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898242+github-actions[bot]@users.noreply.github.com"
          git add 30_LongevityAI_Biological_Age_and_Healthy_Aging_Intelligence.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
          else
            git commit -m "Execute Project 30 LongevityAI and save results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

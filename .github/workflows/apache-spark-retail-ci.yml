name: Apache Spark retail intelligence CI

on:
  push:
    branches: [main, portfolio-next-level]
    paths:
      - "projects/apache_spark_retail_intelligence/**"
      - ".github/workflows/apache-spark-retail-ci.yml"
  pull_request:
    paths:
      - "projects/apache_spark_retail_intelligence/**"
      - ".github/workflows/apache-spark-retail-ci.yml"

permissions:
  contents: read

jobs:
  spark-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Spark test dependencies
        run: python -m pip install --upgrade pip numpy pandas pyspark pytest
      - name: Run Spark retail data-contract tests
        working-directory: projects/apache_spark_retail_intelligence
        run: python -m pytest -q tests
